<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Altered Draft Simulator</title>
    <!-- Set the theme before first paint to avoid a flash of the wrong palette. -->
    <script>try{document.documentElement.dataset.theme=localStorage.getItem('theme')||'dark'}catch(e){document.documentElement.dataset.theme='dark'}</script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fraunces = closest free match to Altered Core's title font (commercial "Tiller"). -->
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <!-- Altered Card Renderer (pinned copy of PolluxTroy0/Altered-Card-Renderer @84adbb8):
         defines the <altered-card> web component that draws a UNIQUE's true face (correct art +
         the unique's own stats) on a canvas. Used to build unique card images, since the real
         unique faces no longer exist on any host (Altered S3 locked) and the CDN only has the rare. -->
    <script src="/altered-card-renderer.min.js"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
