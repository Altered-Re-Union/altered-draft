name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push on a PR cancels the run still going for the previous one; main runs every push.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  unit:
    name: Unit + integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm test

      # api/rooms/* against a throwaway Postgres (docker-compose.test.yml, started by globalSetup).
      - run: npm run test:integration

      - run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # The suite serves the BUILT app (tests/e2e/app-server.mjs), like `make e2e`.
      - run: npm run build

      - run: npx playwright install --with-deps chromium

      # Postgres on 55433 (docker-compose.e2e.yml), fakes on 8091, the app on 8090 — all
      # started by the Playwright config.
      - run: npm run test:e2e

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
