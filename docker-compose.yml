# Local dev stack (see Makefile — `make dev`). Postgres only: Realtime is deliberately
# left out locally, so live multiplayer updates don't work here (CRUD does).
# Schemas are NOT applied via docker-entrypoint-initdb.d (that only runs on a fresh
# volume) — `make db-migrate` re-applies the idempotent *.sql files on every start,
# mirroring the `migrations` image in build/Dockerfile.
services:
  postgres:
    image: postgres:17-alpine
    container_name: altered-draft-postgres
    environment:
      POSTGRES_DB: altered-draft
      POSTGRES_USER: altered-draft
      POSTGRES_PASSWORD: altered-draft
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./:/schemas:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U altered-draft -d altered-draft']
      interval: 1s
      timeout: 2s
      retries: 30

volumes:
  pgdata:
